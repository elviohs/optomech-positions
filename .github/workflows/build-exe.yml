name: build-exe
# Genera el ejecutable de Windows. Al subir una etiqueta v* lo adjunta a la release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: pytest -q
      - run: pyinstaller --noconfirm --clean optomech-positions.spec
      - name: Autoprueba del ejecutable
        shell: pwsh
        run: |
          $p = Start-Process dist\optomech-positions.exe -ArgumentList "--autotest", "ejemplos\sistema_3_espejos\ejemplo_3_espejos.json", "autotest.xlsx" -Wait -PassThru
          if (Test-Path autotest.log) { Get-Content autotest.log }
          if ($p.ExitCode -ne 0 -or -not (Test-Path autotest.xlsx)) { throw "La autoprueba del ejecutable ha fallado" }
      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force paquete | Out-Null
          Copy-Item dist\optomech-positions.exe paquete\
          Copy-Item materiales.json, README.md, CHANGELOG.md paquete\
          Copy-Item ejemplos paquete\ejemplos -Recurse
          Compress-Archive -Path paquete\* -DestinationPath optomech-positions-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: optomech-positions-windows
          path: optomech-positions-windows.zip
      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME optomech-positions-windows.zip --title $env:GITHUB_REF_NAME --notes "Ejecutable para Windows. Cambios: ver CHANGELOG.md"
          } else {
            gh release upload $env:GITHUB_REF_NAME optomech-positions-windows.zip --clobber
          }
