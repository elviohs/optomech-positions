name: build-exe
# Genera el ejecutable de Windows. Al subir una etiqueta v* lo adjunta a la release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: pytest -q
      - run: pyinstaller --noconfirm --clean optomech-positions.spec
      - name: Autoprueba del ejecutable
        shell: pwsh
        run: |
          $p = Start-Process dist\optomech-positions.exe -ArgumentList "--autotest", "ejemplos\sistema_3_espejos\ejemplo_3_espejos.json", "autotest.xlsx" -Wait -PassThru
          if (Test-Path autotest.log) { Get-Content autotest.log }
          if ($p.ExitCode -ne 0 -or -not (Test-Path autotest.xlsx)) { throw "La autoprueba del ejecutable ha fallado" }
      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force paquete | Out-Null
          Copy-Item dist\optomech-positions.exe paquete\
          Copy-Item materiales.json, README.md, CHANGELOG.md paquete\
          Copy-Item ejemplos paquete\ejemplos -Recurse
          Compress-Archive -Path paquete\* -DestinationPath optomech-positions-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: optomech-positions-windows
          path: optomech-positions-windows.zip
      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notas: plantilla .github/release_notes.md + sección de CHANGELOG.md de esta versión
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag -replace '^v', ''
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $ini = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match ('^## ' + [regex]::Escape($ver) + '(\s|$)')) { $ini = $i; break }
          }
          if ($ini -lt 0) {
            $changes = "Ver CHANGELOG.md."
          } else {
            $sec = @()
            for ($j = $ini + 1; $j -lt $lines.Count -and $lines[$j] -notmatch '^## '; $j++) { $sec += $lines[$j] }
            $changes = ($sec -join "`n").Trim()
          }
          $m = (pytest -q --collect-only | Out-String) | Select-String '(\d+) tests? collected'
          $ntests = if ($m) { $m.Matches[0].Groups[1].Value } else { 'Varios' }
          $notes = (Get-Content .github\release_notes.md -Raw -Encoding utf8).Replace('{VERSION}', $tag).Replace('{TAG}', $tag).Replace('{CHANGES}', $changes).Replace('{NTESTS}', $ntests)
          [IO.File]::WriteAllText("$PWD\notas_release.md", $notes, (New-Object Text.UTF8Encoding $false))
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag optomech-positions-windows.zip --title $tag --notes-file notas_release.md
          } else {
            gh release upload $tag optomech-positions-windows.zip --clobber
            gh release edit $tag --notes-file notas_release.md
          }
